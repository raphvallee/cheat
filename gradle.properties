# Client identity. The launcher version id becomes "<client_name>-<minecraft_version>".
client_name=Cheat
client_version=1.0.0
minecraft_version=26.3

# Username for ./gradlew runClient (offline session, singleplayer / offline-mode servers only).
dev_username=Dev

# Official launcher folder used by runClient (asset reuse) and installClient.
# Leave empty for the OS default (%APPDATA%/.minecraft, ~/Library/Application Support/minecraft, ~/.minecraft).
minecraft_dir=

org.gradle.jvmargs=-Xmx2G
org.gradle.caching=true
